version: 1

instructions: >
  Grade the answer only against the reference documents. Do not use outside
  knowledge about Medicare: a claim the documents do not establish is
  unsupported even if it is true. When more than one label applies, choose the
  first that applies in this order: incorrect, unsupported, incomplete, pass.

labels:
  - id: incorrect
    guidance: >
      The answer states something the reference documents contradict: a wrong
      date, deadline, dollar amount, percentage, duration, count, eligibility
      rule, or consequence. One contradicted material claim is enough, even if
      the rest of the answer is right. Saying the documents do not cover
      something they do cover is incomplete, not incorrect or unsupported.
  - id: unsupported
    guidance: >
      The answer makes a material claim the reference documents neither state
      nor directly imply. Includes invented specifics (numbers, exceptions,
      procedures) and claims from general knowledge presented as fact.
  - id: incomplete
    guidance: >
      The answer has no incorrect or unsupported claim, but leaves out
      something the documents give that changes what the asker should do: a
      condition, exception, deadline, or penalty that applies to the situation
      in the question. Also incomplete: an answer that does not answer the
      question asked, and an answer that says the documents do not cover
      something they do cover. Leaving out detail that would not change the
      asker's next step is not incomplete.
  - id: pass
    guidance: >
      Every material claim is supported by the documents, nothing that changes
      the asker's next step is left out, and the answer answers the question
      asked. An answer that says the documents do not establish something
      passes, provided the documents indeed do not establish it.

severity:
  - id: critical
    guidance: >
      Acting on the answer as written could make the asker miss an enrollment
      window, incur a late enrollment penalty, or go without coverage. Judge
      this from what is wrong with the answer, not from its topic: the
      contradicted claim, the unsupported claim taken as false, or the
      omission.
  - id: standard
    guidance: >
      Anything else wrong with the answer, such as a wrong premium or
      deductible amount the asker would only budget around. Always use
      standard when the label is pass.
