# judgelock rubric. Spliced verbatim into the judge prompt as {{rubric}} and
# hashed into the evaluator id: any byte change here, comments included, is an
# identity change that requires a new approved validation run.

version: 1

instructions: >
  Grade the answer only against the reference documents. Do not use outside
  knowledge about Medicare: a claim the documents do not establish is
  unsupported even if it is true. When more than one label applies, choose the
  first that applies in this order: incorrect, unsupported, incomplete, pass.

labels:
  - id: incorrect
    guidance: >
      The answer states something the reference documents contradict: a wrong
      date, deadline, dollar amount, percentage, duration, count, eligibility
      rule, or consequence. One contradicted material claim is enough, even if
      the rest of the answer is right.
  - id: unsupported
    guidance: >
      The answer makes a material claim the reference documents neither state
      nor directly imply. Includes invented specifics (numbers, exceptions,
      procedures) and claims from general knowledge presented as fact.
  - id: incomplete
    guidance: >
      Everything the answer states is supported, but it omits information the
      documents give that changes what the asker should do: a condition,
      exception, deadline, or penalty that applies to the situation described
      in the question. Omitting detail that would not change the asker's next
      step is not incomplete.
  - id: pass
    guidance: >
      Every material claim is supported by the documents, nothing that changes
      the asker's next step is omitted, and the answer addresses the question
      asked. An answer that says the documents do not establish something
      passes, provided the documents indeed do not establish it.

severity:
  - id: critical
    guidance: >
      Acting on the answer as written could make the asker miss an enrollment
      window, incur a late enrollment penalty, or go without coverage. Judge
      this from the answer's error, not from the topic.
  - id: standard
    guidance: >
      Any other error, such as a wrong premium or deductible amount the asker
      would only budget around. Always use standard when the label is pass.
