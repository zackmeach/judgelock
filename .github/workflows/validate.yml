name: validate

# Manual dispatch only. This job makes real judge API calls and costs money.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Repeats per case; only the runs pinned in validation/thresholds.json (3) is promotable
        required: false
        default: "3"

permissions:
  contents: write

# One validation run at a time; two concurrent runs would race on the commit.
concurrency:
  group: validate-${{ github.ref }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --ignore-scripts

      # The input reaches the shell only as an env var; inlining it would be
      # shell injection with a token that can push to the branch.
      - run: npm run validate -- --runs "$RUNS"
        env:
          RUNS: ${{ inputs.runs }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # Paid evidence survives a failed run or push. The artifact expires; the
      # commit below is the permanently linkable record.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ github.run_id }}
          path: validation/

      # Committed to the branch: artifacts expire, and a validation record has
      # to stay permanently linkable.
      - name: Commit candidate manifest and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/
          git diff --staged --quiet && echo "no changes to commit" && exit 0
          git commit -m "validate: candidate manifest from run ${{ github.run_id }}"
          git push
